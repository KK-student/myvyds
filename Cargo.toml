[package]
name = "myvids"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-multipart = "0.8.1"
actix-web = {version = "4.15.0"}
argon2 = "0.6.0"
futures = "0.3.34"
image = {version = "0.25.10", default-features = false, features=["default-formats"]}
imageproc = {version = "0.27.0", default-features = false}
json-escape = {version = "0.3.1", features = ["alloc"]}
num-traits = "0.2.19"
rand = "0.10.2"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
tokio = {version = "1.53.1", features = ["fs"]}
tokio-util = "0.7.19"

# Test dependencies (to remove from this section later): 
curl = {version = "0.4.50"}

[target.'cfg(unix)'.dependencies]
nix = {version = "0.31.3", features = ["signal", "process", "fs"]}

[target.'cfg(windows)'.dependencies]
windows = "0.62.2"

[dev-dependencies]
#reqwest = {version = "0.13.5", default-features = false, features=["multipart", "stream"]}
pretty_assertions = {version = "1.4.1"}
#attohttpc = {version = "0.31.0", features=["multipart-form"]}
multipart = {version = "0.18.0" }
curl = "0.4.50"
