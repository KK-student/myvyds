[package]
name = "myvids"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-multipart = "0.8.1"
actix-web = {version = "4.15.0"}
argon2 = "0.6.0"
futures = "0.3.34"
json-escape = {version = "0.3.1", features = ["alloc"]}
num-traits = "0.2.19"
rand = "0.10.2"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
tokio = {version = "1.53.1", features = ["fs"]}
tokio-util = "0.7.19"

[target.'cfg(unix)'.dependencies]
nix = {version = "0.31.3", features = ["signal", "process", "fs"]}

[target.'cfg(windows)'.dependencies]
#winapi = "0.3.9"
windows = "0.62.2"
