[package]
name = "myvids"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "*"
futures = "*"
json-escape = {version = "*", features = ["alloc"]}
num-traits = "0.2.19"
serde = {version = "*", features = ["derive"]}
serde_json = "*"
tokio = {version = "*", features = ["fs"]}
tokio-util = "*"

[target.'cfg(unix)'.dependencies]
nix = {version = "*", features = ["signal", "process"]}
